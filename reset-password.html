<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mejora 2 - Recuperar Contraseña</title>

    <!--
      =================================================================
      reset-password.html — Página de restablecimiento de contraseña
      (standalone, fuera del monolito index.html)
      =================================================================

      Changelog:
      v1.1.0 (2026-10-11)
        · FIX 🔴  Regex de símbolos ahora acepta cualquier no-alfanumérico.
                 Antes el mensaje ofrecía '#' y '^' pero el regex los
                 rechazaba, causando fallos silenciosos en validación.
        · FIX 🟠  Tras un submit fallido, los inputs se resetean a
                 type="password" y los toggles restauran su ícono y
                 aria-label originales (evita leak visual).
        · FIX 🟡  Timeout de verificación subido de 10s a 15s para
                 tolerar redes lentas sin falsos positivos.
        · FEAT 🟡 Soporte de modo oscuro. Lee localStorage (varias
                 claves candidatas) + prefers-color-scheme como fallback.
                 Aplica la clase antes del primer render (sin FOUC).
        · IMPR 🟡 #confirm-hint migrado a patrón de dos nodos con roles
                 estáticos (#confirm-hint-status con role="status" y
                 #confirm-hint-alert con role="alert"). Máxima
                 compatibilidad con lectores de pantalla viejos: el role
                 se evalúa al parsear el HTML, no dinámicamente.
        · IMPR 🟡 Mensaje de auth/too-many-requests generalizado.
        · CHOR 🟢 action="#" en el form como defensa declarativa.

      Requiere: Firebase compat SDK 10.8.0 (gstatic.com).
      Contrato: URL con ?mode=resetPassword&oobCode=XXX (Firebase Auth).
      =================================================================
    -->

    <!-- [SEG] No indexar ni filtrar la URL completa (con oobCode) vía Referer. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">

    <!-- [SEG] CSP. 'unsafe-inline' es necesario por el <style> y <script>
         inline. Migrar a archivos externos permitiría quitarlo.
         frame-src whitelistea el iframe de Auth de Firebase por si el SDK
         lo carga lazy en alguna versión. frame-ancestors y form-action
         quedan como defensa documental (frame-ancestors se ignora en meta
         CSP por spec, pero se mantiene por consistencia con el resto). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' https://www.gstatic.com;
                   style-src 'self' 'unsafe-inline';
                   connect-src 'self'
                               https://identitytoolkit.googleapis.com
                               https://securetoken.googleapis.com
                               https://www.googleapis.com
                               https://firebaseinstallations.googleapis.com;
                   img-src 'self' data:;
                   font-src 'self' data:;
                   frame-src https://mejora2-9eec7.firebaseapp.com;
                   frame-ancestors 'none';
                   base-uri 'self';
                   form-action 'self';
                   object-src 'none';">

    <!-- [TEMA] Init de modo oscuro. Se ejecuta antes del <style> para evitar
         FOUC. Lee varias claves candidatas de localStorage (por
         compatibilidad con la implementación de window.Tema en index.html)
         y cae a prefers-color-scheme si no hay preferencia guardada. -->
    <script>
    (function () {
        try {
            var stored = null;
            var keys = ['tema_v1', 'tema', 'theme', 'mejora2_tema'];
            for (var i = 0; i < keys.length; i++) {
                var v = localStorage.getItem(keys[i]);
                if (v) { stored = v; break; }
            }
            var isDark;
            if (stored === 'dark' || stored === 'oscuro') {
                isDark = true;
            } else if (stored === 'light' || stored === 'claro') {
                isDark = false;
            } else {
                isDark = !!(window.matchMedia
                    && window.matchMedia('(prefers-color-scheme: dark)').matches);
            }
            if (isDark) {
                document.documentElement.classList.add('dark');
            }
        } catch (e) { /* localStorage bloqueado o matchMedia no soportado. */ }
    })();
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        /* =========================================================
           Reset + base
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { color-scheme: light; }
        html.dark { color-scheme: dark; }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.25s ease;
        }

        .container {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            transition: background 0.25s ease, box-shadow 0.25s ease;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
            min-height: 20px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px;
            padding-right: 44px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s, background 0.25s, color 0.25s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Feedback visual de coincidencia en el campo de confirmación. */
        .input-wrapper input.input-match { border-color: #2a9d4a; }
        .input-wrapper input.input-mismatch { border-color: #d33; }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            padding: 5px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s, opacity 0.2s;
        }

        .toggle-password:hover:not(:disabled),
        .toggle-password:focus-visible:not(:disabled) {
            color: #667eea;
            background: rgba(102, 126, 234, 0.08);
        }

        .toggle-password:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .password-requirements {
            font-size: 11px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #888;
            transition: color 0.2s;
        }

        .requirement.valid { color: #2a9d4a; }
        .requirement.invalid { color: #d33; }

        .requirement::before {
            content: '○';
            font-size: 10px;
            width: 10px;
            display: inline-block;
            text-align: center;
        }

        .requirement.valid::before { content: '✓'; }
        .requirement.invalid::before { content: '✗'; }

        /* Hint de coincidencia de contraseñas (feedback en vivo).
           Patrón de dos nodos: uno con role="status" (polite) y otro con
           role="alert" (assertive). Solo uno tiene texto a la vez. Ambos
           están posicionados en el mismo lugar para ocupar el mismo
           espacio y evitar saltos de layout cuando alternan. */
        .confirm-hint {
            position: relative;
            min-height: 14px;
            margin-top: 3px;
            font-size: 11px;
        }

        .confirm-hint-line {
            position: absolute;
            top: 0;
            left: 0;
            color: transparent;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .confirm-hint-line.match { color: #2a9d4a; }
        .confirm-hint-line.mismatch { color: #d33; }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .error {
            color: #d33;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        .success {
            color: #2a9d4a;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }

        /* Vista de carga inicial (verificación del oobCode) */
        .loading-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 16px;
        }

        .loading-view .spinner {
            width: 36px;
            height: 36px;
            border-width: 4px;
            border-color: rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            margin: 0;
        }

        .loading-view .loading-text {
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        /* Link "Volver al login" bajo el formulario */
        .back-to-login {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .back-to-login a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-to-login a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* =========================================================
           Modo oscuro
           ========================================================= */
        html.dark body {
            background: linear-gradient(135deg, #2a2a4a 0%, #3d2a5e 100%);
        }

        html.dark .container {
            background: #1f1f2e;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        html.dark h1 { color: #e8e8f0; }
        html.dark .subtitle { color: #a0a0b0; }
        html.dark .form-group label { color: #d0d0e0; }

        html.dark .input-wrapper input {
            background: #2a2a3a;
            border-color: #3a3a4a;
            color: #e8e8f0;
        }
        html.dark .input-wrapper input:focus { border-color: #8a9aee; }
        html.dark .input-wrapper input.input-match { border-color: #4ec27a; }
        html.dark .input-wrapper input.input-mismatch { border-color: #ff6b6b; }

        html.dark .toggle-password { color: #808090; }
        html.dark .toggle-password:hover:not(:disabled),
        html.dark .toggle-password:focus-visible:not(:disabled) {
            color: #8a9aee;
            background: rgba(138, 154, 238, 0.12);
        }

        html.dark .requirement { color: #808090; }
        html.dark .requirement.valid { color: #4ec27a; }
        html.dark .requirement.invalid { color: #ff6b6b; }

        html.dark .confirm-hint-line.match { color: #4ec27a; }
        html.dark .confirm-hint-line.mismatch { color: #ff6b6b; }

        html.dark .btn-secondary {
            background: #2a2a3a;
            color: #e8e8f0;
        }
        html.dark .btn-secondary:hover { background: #3a3a4a; }

        html.dark .error { color: #ff6b6b; }
        html.dark .success { color: #4ec27a; }

        html.dark .loading-view .spinner {
            border-color: rgba(138, 154, 238, 0.2);
            border-top-color: #8a9aee;
        }
        html.dark .loading-view .loading-text { color: #a0a0b0; }

        html.dark .back-to-login a { color: #8a9aee; }
        html.dark .back-to-login a:hover { color: #a0b0ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Nueva Contraseña</h1>
        <p class="subtitle" id="subtitle">Verificando enlace...</p>

        <!-- ================================================================ -->
        <!-- Vista 1: Cargando (verificando el oobCode con Firebase Auth)     -->
        <!-- ================================================================ -->
        <div id="view-loading" class="loading-view" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <p class="loading-text">Verificando enlace de recuperación...</p>
        </div>

        <!-- ================================================================ -->
        <!-- Vista 2: Formulario de nueva contraseña                          -->
        <!-- ================================================================ -->
        <div id="view-form" class="hidden">
            <form id="form-reset" class="form" novalidate action="#">
                <div class="form-group">
                    <label for="new-password">Nueva Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password"
                               id="new-password"
                               required
                               placeholder="Mínimo 8 caracteres"
                               autocomplete="new-password"
                               aria-describedby="password-requirements">
                        <button type="button"
                                class="toggle-password"
                                data-target="new-password"
                                aria-label="Mostrar u ocultar contraseña"
                                title="Mostrar u ocultar contraseña">👁️</button>
                    </div>
                    <div class="password-requirements"
                         id="password-requirements"
                         role="status"
                         aria-live="polite">
                        <div class="requirement invalid" id="req-length">Mínimo 8 caracteres</div>
                        <div class="requirement invalid" id="req-uppercase">Una mayúscula (A-Z)</div>
                        <div class="requirement invalid" id="req-lowercase">Una minúscula (a-z)</div>
                        <div class="requirement invalid" id="req-number">Un número (0-9)</div>
                        <div class="requirement invalid" id="req-symbol">Un símbolo (!@#$%^&*)</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password"
                               id="confirm-password"
                               required
                               placeholder="Repetí la contraseña"
                               autocomplete="new-password"
                               aria-describedby="confirm-hint">
                        <button type="button"
                                class="toggle-password"
                                data-target="confirm-password"
                                aria-label="Mostrar u ocultar contraseña"
                                title="Mostrar u ocultar contraseña">👁️</button>
                    </div>
                    <div id="confirm-hint" class="confirm-hint">
                        <small id="confirm-hint-status"
                               class="confirm-hint-line"
                               role="status"
                               aria-live="polite"></small>
                        <small id="confirm-hint-alert"
                               class="confirm-hint-line"
                               role="alert"
                               aria-live="assertive"></small>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-submit">
                    Actualizar Contraseña
                </button>

                <p id="error-msg"
                   class="error"
                   role="alert"
                   aria-live="assertive"
                   aria-atomic="true"></p>
            </form>

            <p class="back-to-login">
                <a href="#" data-login-link>← Volver al login</a>
            </p>
        </div>

        <!-- ================================================================ -->
        <!-- Vista 3: Éxito                                                   -->
        <!-- ================================================================ -->
        <div id="view-success" class="hidden" role="status" aria-live="polite">
            <p class="success" style="font-size: 16px; margin-bottom: 20px;">
                ✅ Tu contraseña fue actualizada correctamente.
            </p>
            <a href="#"
               data-login-link
               class="btn btn-primary"
               style="text-decoration: none; text-align: center; display: block;">
                Volver al Login
            </a>
        </div>

        <!-- ================================================================ -->
        <!-- Vista 4: Error de enlace inválido / expirado                     -->
        <!-- ================================================================ -->
        <div id="view-error" class="hidden" role="alert" aria-live="assertive">
            <p id="error-link-msg"
               class="error"
               style="font-size: 14px; margin-bottom: 20px;"></p>
            <a href="#"
               data-login-link
               class="btn btn-secondary">
                Volver al Login
            </a>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* ============================================================ */
        /* 0. GUARD DE SDK                                              */
        /* ============================================================ */
        /* Si la CDN de Firebase falla (offline, bloqueador, DNS roto), */
        /* `firebase` es undefined y todo el script crashea. Mostramos  */
        /* un error legible en vez de una página en blanco.             */
        if (typeof firebase === 'undefined') {
            document.addEventListener('DOMContentLoaded', function () {
                var loadingView = document.getElementById('view-loading');
                var errorView = document.getElementById('view-error');
                var errorMsg = document.getElementById('error-link-msg');
                var subtitle = document.getElementById('subtitle');
                if (loadingView) loadingView.classList.add('hidden');
                if (errorView) errorView.classList.remove('hidden');
                if (errorMsg) {
                    errorMsg.textContent =
                        'No se pudo cargar Firebase. Verificá tu conexión y recargá la página.';
                }
                if (subtitle) subtitle.textContent = 'Error de carga';
            });
            return;
        }

        /* ============================================================ */
        /* 1. CONFIGURACIÓN DE FIREBASE                                 */
        /* ============================================================ */
        var firebaseConfig = {
            apiKey: "AIzaSyBKqZH1mF983q04o8_XtuE7waF3tlBeXnI",
            authDomain: "mejora2-9eec7.firebaseapp.com",
            projectId: "mejora2-9eec7",
            storageBucket: "mejora2-9eec7.firebasestorage.app",
            messagingSenderId: "892721742749",
            appId: "1:892721742749:web:f37fa5364d2bc190736574"
        };

        try {
            if (!firebase.apps || firebase.apps.length === 0) {
                firebase.initializeApp(firebaseConfig);
            }
        } catch (e) {
            console.warn('[Reset] No se pudo inicializar Firebase:', e && e.code);
            var _loadingView0 = document.getElementById('view-loading');
            var _errorView0 = document.getElementById('view-error');
            var _errorMsg0 = document.getElementById('error-link-msg');
            if (_loadingView0) _loadingView0.classList.add('hidden');
            if (_errorView0) _errorView0.classList.remove('hidden');
            if (_errorMsg0) {
                _errorMsg0.textContent =
                    'Error al inicializar el servicio. Recargá la página e intentá de nuevo.';
            }
            return;
        }

        var auth = firebase.auth();

        /* ============================================================ */
        /* 2. CONSTANTES Y ESTADO                                       */
        /* ============================================================ */
        var LOGIN_URL = 'https://arboldelosterro.github.io/Mejora2/';

        /* [FIX v1.1.0] Timeout subido de 10s a 15s. El valor anterior era
         * agresivo para redes lentas (3G, WiFi saturada) y producía
         * falsos positivos de "verificación tardó demasiado". 15s sigue
         * siendo un timeout útil contra bloqueos reales. */
        var OOB_VERIFY_TIMEOUT_MS = 15000;

        var actionCode = null;    // oobCode validado, listo para confirmPasswordReset
        var isSubmitting = false; // guard anti-doble-submit

        /* Cache de elementos del DOM (evita lookups repetidos). */
        var $ = function (id) { return document.getElementById(id); };

        var elSubtitle    = $('subtitle');
        var elViewLoading = $('view-loading');
        var elViewForm    = $('view-form');
        var elViewSuccess = $('view-success');
        var elViewError   = $('view-error');
        var elErrorMsg    = $('error-msg');
        var elErrorLinkMsg = $('error-link-msg');
        var elNewPassword = $('new-password');
        var elConfirmPassword = $('confirm-password');
        var elConfirmHintStatus = $('confirm-hint-status');  // live region para match
        var elConfirmHintAlert  = $('confirm-hint-alert');   // live region para mismatch
        var elFormReset   = $('form-reset');
        var elBtnSubmit   = $('btn-submit');

        /* Setear todos los links de login dinámicamente desde LOGIN_URL.
         * Evita duplicar la URL hardcodeada. */
        document.querySelectorAll('[data-login-link]').forEach(function (a) {
            a.setAttribute('href', LOGIN_URL);
        });

        /* ============================================================ */
        /* 3. GESTIÓN DE VISTAS                                         */
        /* ============================================================ */
        function mostrarVista(nombre) {
            /* nombre: 'loading' | 'form' | 'success' | 'error' */
            var vistas = {
                loading: elViewLoading,
                form:    elViewForm,
                success: elViewSuccess,
                error:   elViewError
            };
            Object.keys(vistas).forEach(function (k) {
                var el = vistas[k];
                if (!el) return;
                if (k === nombre) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        function mostrarErrorLink(msg) {
            if (elErrorLinkMsg) elErrorLinkMsg.textContent = msg;
            if (elSubtitle) elSubtitle.textContent = 'Enlace inválido';
            mostrarVista('error');
        }

        /* ============================================================ */
        /* 4. VALIDACIÓN DE CONTRASEÑA                                  */
        /* ============================================================ */
        function validarContrasena(password) {
            var checks = {
                length:    password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number:    /[0-9]/.test(password),
                /* [FIX v1.1.0] Antes: /[@$!%*?&]/. Ese regex NO aceptaba
                 * '#' ni '^', pero el mensaje visible al usuario los
                 * ofrecía como válidos. Resultado: contraseñas como
                 * 'Kiosco2024#' fallaban la validación sin explicación.
                 * Ahora aceptamos cualquier no-alfanumérico, que es la
                 * definición estándar de "símbolo" y coincide con la
                 * promesa del mensaje. */
                symbol:    /[^A-Za-z0-9]/.test(password)
            };

            Object.keys(checks).forEach(function (k) {
                var el = $('req-' + k);
                if (!el) return;
                el.classList.toggle('valid', checks[k]);
                el.classList.toggle('invalid', !checks[k]);
            });

            return Object.keys(checks).every(function (k) { return checks[k]; });
        }

        /* Feedback en vivo de coincidencia de contraseñas.
         * Patrón de dos nodos: cada uno con role FIJO en el HTML.
         *   · #confirm-hint-status → role="status",  aria-live="polite"
         *   · #confirm-hint-alert  → role="alert",   aria-live="assertive"
         * Solo uno tiene texto a la vez. El lector de pantalla evalúa el
         * role al parsear el HTML (no dinámicamente), por lo que el anuncio
         * es 100% confiable en todos los lectores, incluidos los viejos. */
        function actualizarFeedbackMatch() {
            if (!elNewPassword || !elConfirmPassword) return;
            var nueva = elNewPassword.value;
            var confirm = elConfirmPassword.value;

            elConfirmPassword.classList.remove('input-match', 'input-mismatch');

            /* Reset de AMBOS nodos (vaciar texto y limpiar clases). */
            if (elConfirmHintStatus) {
                elConfirmHintStatus.textContent = '';
                elConfirmHintStatus.classList.remove('match', 'mismatch');
            }
            if (elConfirmHintAlert) {
                elConfirmHintAlert.textContent = '';
                elConfirmHintAlert.classList.remove('match', 'mismatch');
            }

            if (!confirm) return; // neutral: ambos nodos vacíos

            if (nueva === confirm) {
                elConfirmPassword.classList.add('input-match');
                if (elConfirmHintStatus) {
                    elConfirmHintStatus.textContent = '✓ Las contraseñas coinciden';
                    elConfirmHintStatus.classList.add('match');
                }
            } else {
                elConfirmPassword.classList.add('input-mismatch');
                if (elConfirmHintAlert) {
                    elConfirmHintAlert.textContent = '✗ Las contraseñas no coinciden';
                    elConfirmHintAlert.classList.add('mismatch');
                }
            }
        }

        /* ============================================================ */
        /* 6. SUBMIT — CAMBIO DE CONTRASEÑA                             */
        /* ============================================================ */
        function onSubmit(e) {
            e.preventDefault();

            if (isSubmitting) return;

            var newPassword = elNewPassword ? elNewPassword.value : '';
            var confirmPassword = elConfirmPassword ? elConfirmPassword.value : '';

            if (elErrorMsg) elErrorMsg.textContent = '';

            if (!validarContrasena(newPassword)) {
                if (elErrorMsg) elErrorMsg.textContent =
                    'La contraseña no cumple con todos los requisitos.';
                return;
            }

            if (newPassword !== confirmPassword) {
                if (elErrorMsg) elErrorMsg.textContent =
                    'Las contraseñas no coinciden.';
                return;
            }

            if (!actionCode) {
                if (elErrorMsg) elErrorMsg.textContent =
                    'El enlace de recuperación es inválido. Solicitá uno nuevo.';
                return;
            }

            isSubmitting = true;
            if (elBtnSubmit) {
                elBtnSubmit.disabled = true;
                elBtnSubmit.innerHTML = '<span class="spinner" aria-hidden="true"></span>Actualizando...';
            }

            /* Deshabilitar los toggle de contraseña durante el submit.
             * Evita que el usuario cambie la visibilidad mientras la
             * operación está en curso. */
            document.querySelectorAll('.toggle-password').forEach(function (b) {
                b.disabled = true;
            });

            auth.confirmPasswordReset(actionCode, newPassword)
                .then(function () {
                    mostrarVista('success');
                })
                .catch(function (error) {
                    var code = (error && error.code) || '';
                    /* Log limpio: solo el code, nunca el objeto completo. */
                    console.warn('[Reset] Error al confirmar reset:', code);

                    var msg = 'No se pudo actualizar la contraseña. Intentá nuevamente.';
                    if (code === 'auth/expired-action-code') {
                        msg = 'El enlace ha expirado. Solicitá uno nuevo.';
                    } else if (code === 'auth/invalid-action-code') {
                        msg = 'El enlace es inválido. Solicitá uno nuevo.';
                    } else if (code === 'auth/weak-password') {
                        msg = 'La contraseña es demasiado débil. Probá con una más fuerte.';
                    } else if (code === 'auth/user-disabled') {
                        msg = 'Esta cuenta está deshabilitada. Contactá al administrador.';
                    } else if (code === 'auth/user-not-found') {
                        msg = 'La cuenta asociada ya no existe.';
                    } else if (code === 'auth/network-request-failed') {
                        msg = 'Sin conexión. Revisá tu internet e intentá de nuevo.';
                    } else if (code === 'auth/too-many-requests') {
                        /* [MEJORA v1.1.0] Mensaje generalizado. El rate
                         * limit de Firebase puede dispararse por usuario,
                         * por IP o por proyecto, no solo por reintentos
                         * del mismo usuario. */
                        msg = 'Demasiados intentos recientes. Esperá unos minutos o intentá desde otra red.';
                    }
                    if (elErrorMsg) elErrorMsg.textContent = msg;
                })
                .finally(function () {
                    isSubmitting = false;
                    if (elBtnSubmit) {
                        elBtnSubmit.disabled = false;
                        elBtnSubmit.textContent = 'Actualizar Contraseña';
                    }
                    /* [FIX v1.1.0] Además de rehabilitar los toggles,
                     * reseteamos los inputs a type="password" y los
                     * íconos/labels al estado neutral. Sin esto, si el
                     * usuario había activado "mostrar contraseña" antes
                     * del submit fallido, la contraseña quedaba visible
                     * en texto plano tras el error (leak visual en un
                     * kiosco con gente alrededor). */
                    document.querySelectorAll('.toggle-password').forEach(function (b) {
                        b.disabled = false;
                        var input = document.getElementById(b.dataset.target);
                        if (input) input.type = 'password';
                        b.textContent = '👁️';
                        b.setAttribute('aria-label', 'Mostrar u ocultar contraseña');
                    });
                });
        }

        /* ============================================================ */
        /* 7. TOGGLE DE CONTRASEÑA                                      */
        /* ============================================================ */
        document.querySelectorAll('.toggle-password').forEach(function (btn) {
            btn.addEventListener('click', function () {
                /* No hacer nada si hay un submit en curso. */
                if (isSubmitting) return;

                var targetId = btn.dataset.target;
                if (!targetId) return;
                var input = document.getElementById(targetId);
                if (!input) return;

                if (input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = '🙈';
                    btn.setAttribute('aria-label', 'Ocultar contraseña');
                } else {
                    input.type = 'password';
                    btn.textContent = '👁️';
                    btn.setAttribute('aria-label', 'Mostrar contraseña');
                }
            });
        });

        /* ============================================================ */
        /* 8. LISTENERS                                                 */
        /* ============================================================ */
        /* En cada input de contraseña:
         *   · validar requisitos en vivo (solo para #new-password)
         *   · actualizar feedback de coincidencia
         *   · limpiar el mensaje de error global */
        if (elNewPassword) {
            elNewPassword.addEventListener('input', function (e) {
                validarContrasena(e.target.value);
                actualizarFeedbackMatch();
                limpiarErrorGlobal();
            });
        }

        if (elConfirmPassword) {
            elConfirmPassword.addEventListener('input', function () {
                actualizarFeedbackMatch();
                limpiarErrorGlobal();
            });
        }

        if (elFormReset) {
            elFormReset.addEventListener('submit', onSubmit);
        }

        /* ============================================================ */
        /* 9. INIT                                                      */
        /* ============================================================ */
        verificarEnlace();

    })();
    </script>
</body>
</html>
