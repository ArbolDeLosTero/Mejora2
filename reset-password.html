<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mejora 2 - Recuperar Contraseña</title>

    <!-- [SEG] Esta página recibe un oobCode en la URL. No debe indexarse
         ni filtrar la URL completa a recursos externos vía Referer. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">

    <!-- [SEG] Content Security Policy: solo permite el SDK de Firebase
         desde gstatic.com y bloquea iframes, objetos y formularios externos.
         frame-src whitelistea el iframe de Auth de Firebase (mejora defensiva
         por si el SDK lo carga de forma lazy en alguna versión).
         'unsafe-inline' es necesario por el <style> y <script> inline.
         Migrar a archivos externos permitiría sacarlo. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline' https://www.gstatic.com;
                   style-src 'self' 'unsafe-inline';
                   connect-src 'self'
                               https://identitytoolkit.googleapis.com
                               https://securetoken.googleapis.com
                               https://www.googleapis.com
                               https://firebaseinstallations.googleapis.com;
                   img-src 'self' data:;
                   font-src 'self' data:;
                   frame-src https://mejora2-9eec7.firebaseapp.com;
                   frame-ancestors 'none';
                   base-uri 'self';
                   form-action 'self';
                   object-src 'none';">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
            min-height: 20px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px;
            padding-right: 44px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Feedback visual de coincidencia en el campo de confirmación.
           Se aplica por JS cuando el usuario ya escribió algo. */
        .input-wrapper input.input-match {
            border-color: #2a9d4a;
        }

        .input-wrapper input.input-mismatch {
            border-color: #d33;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            padding: 5px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s, opacity 0.2s;
        }

        .toggle-password:hover:not(:disabled),
        .toggle-password:focus-visible:not(:disabled) {
            color: #667eea;
            background: rgba(102, 126, 234, 0.08);
        }

        .toggle-password:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .password-requirements {
            font-size: 11px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #888;
            transition: color 0.2s;
        }

        .requirement.valid { color: #2a9d4a; }
        .requirement.invalid { color: #d33; }

        .requirement::before {
            content: '○';
            font-size: 10px;
            width: 10px;
            display: inline-block;
            text-align: center;
        }

        .requirement.valid::before { content: '✓'; }
        .requirement.invalid::before { content: '✗'; }

        /* Hint de coincidencia de contraseñas (feedback en vivo). */
        .confirm-hint {
            font-size: 11px;
            min-height: 14px;
            margin-top: 3px;
            color: transparent;
            transition: color 0.2s;
        }

        .confirm-hint.match { color: #2a9d4a; }
        .confirm-hint.mismatch { color: #d33; }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .error {
            color: #d33;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        .success {
            color: #2a9d4a;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }

        /* Vista de carga inicial (verificación del oobCode) */
        .loading-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 16px;
        }

        .loading-view .spinner {
            width: 36px;
            height: 36px;
            border-width: 4px;
            border-color: rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            margin: 0;
        }

        .loading-view .loading-text {
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        /* Link "Volver al login" bajo el formulario */
        .back-to-login {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        .back-to-login a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-to-login a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Nueva Contraseña</h1>
        <p class="subtitle" id="subtitle">Verificando enlace...</p>

        <!-- ================================================================ -->
        <!-- Vista 1: Cargando (verificando el oobCode con Firebase Auth)     -->
        <!-- ================================================================ -->
        <div id="view-loading" class="loading-view" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <p class="loading-text">Verificando enlace de recuperación...</p>
        </div>

        <!-- ================================================================ -->
        <!-- Vista 2: Formulario de nueva contraseña                          -->
        <!-- ================================================================ -->
        <div id="view-form" class="hidden">
            <form id="form-reset" class="form" novalidate>
                <div class="form-group">
                    <label for="new-password">Nueva Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password"
                               id="new-password"
                               required
                               placeholder="Mínimo 8 caracteres"
                               autocomplete="new-password"
                               aria-describedby="password-requirements">
                        <button type="button"
                                class="toggle-password"
                                data-target="new-password"
                                aria-label="Mostrar u ocultar contraseña"
                                title="Mostrar u ocultar contraseña">👁️</button>
                    </div>
                    <div class="password-requirements"
                         id="password-requirements"
                         role="status"
                         aria-live="polite">
                        <div class="requirement invalid" id="req-length">Mínimo 8 caracteres</div>
                        <div class="requirement invalid" id="req-uppercase">Una mayúscula (A-Z)</div>
                        <div class="requirement invalid" id="req-lowercase">Una minúscula (a-z)</div>
                        <div class="requirement invalid" id="req-number">Un número (0-9)</div>
                        <div class="requirement invalid" id="req-symbol">Un símbolo (!@#$%^&*)</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password"
                               id="confirm-password"
                               required
                               placeholder="Repetí la contraseña"
                               autocomplete="new-password"
                               aria-describedby="confirm-hint">
                        <button type="button"
                                class="toggle-password"
                                data-target="confirm-password"
                                aria-label="Mostrar u ocultar contraseña"
                                title="Mostrar u ocultar contraseña">👁️</button>
                    </div>
                    <small id="confirm-hint"
                           class="confirm-hint"
                           role="status"
                           aria-live="polite"></small>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-submit">
                    Actualizar Contraseña
                </button>

                <p id="error-msg"
                   class="error"
                   role="alert"
                   aria-live="assertive"
                   aria-atomic="true"></p>
            </form>

            <p class="back-to-login">
                <a href="#" data-login-link>← Volver al login</a>
            </p>
        </div>

        <!-- ================================================================ -->
        <!-- Vista 3: Éxito                                                   -->
        <!-- ================================================================ -->
        <div id="view-success" class="hidden" role="status" aria-live="polite">
            <p class="success" style="font-size: 16px; margin-bottom: 20px;">
                ✅ Tu contraseña fue actualizada correctamente.
            </p>
            <a href="#"
               data-login-link
               class="btn btn-primary"
               style="text-decoration: none; text-align: center; display: block;">
                Volver al Login
            </a>
        </div>

        <!-- ================================================================ -->
        <!-- Vista 4: Error de enlace inválido / expirado                     -->
        <!-- ================================================================ -->
        <div id="view-error" class="hidden" role="alert" aria-live="assertive">
            <p id="error-link-msg"
               class="error"
               style="font-size: 14px; margin-bottom: 20px;"></p>
            <a href="#"
               data-login-link
               class="btn btn-secondary">
                Volver al Login
            </a>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        /* ============================================================ */
        /* 0. GUARD DE SDK                                              */
        /* ============================================================ */
        /* Si la CDN de Firebase falla (offline, bloqueador, DNS roto), */
        /* `firebase` es undefined y todo el script crashea. Mostramos  */
        /* un error legible en vez de una página en blanco.             */
        if (typeof firebase === 'undefined') {
            document.addEventListener('DOMContentLoaded', function () {
                var loadingView = document.getElementById('view-loading');
                var errorView = document.getElementById('view-error');
                var errorMsg = document.getElementById('error-link-msg');
                var subtitle = document.getElementById('subtitle');
                if (loadingView) loadingView.classList.add('hidden');
                if (errorView) errorView.classList.remove('hidden');
                if (errorMsg) {
                    errorMsg.textContent =
                        'No se pudo cargar Firebase. Verificá tu conexión y recargá la página.';
                }
                if (subtitle) subtitle.textContent = 'Error de carga';
            });
            return;
        }

        /* ============================================================ */
        /* 1. CONFIGURACIÓN DE FIREBASE                                 */
        /* ============================================================ */
        var firebaseConfig = {
            apiKey: "AIzaSyBKqZH1mF983q04o8_XtuE7waF3tlBeXnI",
            authDomain: "mejora2-9eec7.firebaseapp.com",
            projectId: "mejora2-9eec7",
            storageBucket: "mejora2-9eec7.firebasestorage.app",
            messagingSenderId: "892721742749",
            appId: "1:892721742749:web:f37fa5364d2bc190736574"
        };

        try {
            if (!firebase.apps || firebase.apps.length === 0) {
                firebase.initializeApp(firebaseConfig);
            }
        } catch (e) {
            console.warn('[Reset] No se pudo inicializar Firebase:', e && e.code);
            var _loadingView0 = document.getElementById('view-loading');
            var _errorView0 = document.getElementById('view-error');
            var _errorMsg0 = document.getElementById('error-link-msg');
            if (_loadingView0) _loadingView0.classList.add('hidden');
            if (_errorView0) _errorView0.classList.remove('hidden');
            if (_errorMsg0) {
                _errorMsg0.textContent =
                    'Error al inicializar el servicio. Recargá la página e intentá de nuevo.';
            }
            return;
        }

        var auth = firebase.auth();

        /* ============================================================ */
        /* 2. CONSTANTES Y ESTADO                                       */
        /* ============================================================ */
        var LOGIN_URL = 'https://arboldelostero.github.io/Mejora2/';
        var OOB_VERIFY_TIMEOUT_MS = 10000;

        var actionCode = null;    // oobCode validado, listo para confirmPasswordReset
        var isSubmitting = false; // guard anti-doble-submit

        /* Cache de elementos del DOM (evita lookups repetidos). */
        var $ = function (id) { return document.getElementById(id); };

        var elSubtitle    = $('subtitle');
        var elViewLoading = $('view-loading');
        var elViewForm    = $('view-form');
        var elViewSuccess = $('view-success');
        var elViewError   = $('view-error');
        var elErrorMsg    = $('error-msg');
        var elErrorLinkMsg = $('error-link-msg');
        var elNewPassword = $('new-password');
        var elConfirmPassword = $('confirm-password');
        var elConfirmHint = $('confirm-hint');
        var elFormReset   = $('form-reset');
        var elBtnSubmit   = $('btn-submit');

        /* [Detección #1] Setear todos los links de login dinámicamente
         * desde LOGIN_URL. Evita duplicar la URL hardcodeada. */
        document.querySelectorAll('[data-login-link]').forEach(function (a) {
            a.setAttribute('href', LOGIN_URL);
        });

        /* ============================================================ */
        /* 3. GESTIÓN DE VISTAS                                         */
        /* ============================================================ */
        function mostrarVista(nombre) {
            /* nombre: 'loading' | 'form' | 'success' | 'error' */
            var vistas = {
                loading: elViewLoading,
                form:    elViewForm,
                success: elViewSuccess,
                error:   elViewError
            };
            Object.keys(vistas).forEach(function (k) {
                var el = vistas[k];
                if (!el) return;
                if (k === nombre) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        function mostrarErrorLink(msg) {
            if (elErrorLinkMsg) elErrorLinkMsg.textContent = msg;
            if (elSubtitle) elSubtitle.textContent = 'Enlace inválido';
            mostrarVista('error');
        }

        /* ============================================================ */
        /* 4. VALIDACIÓN DE CONTRASEÑA                                  */
        /* ============================================================ */
        function validarContrasena(password) {
            var checks = {
                length:    password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number:    /[0-9]/.test(password),
                symbol:    /[@$!%*?&]/.test(password)
            };

            Object.keys(checks).forEach(function (k) {
                var el = $('req-' + k);
                if (!el) return;
                el.classList.toggle('valid', checks[k]);
                el.classList.toggle('invalid', !checks[k]);
            });

            return Object.keys(checks).every(function (k) { return checks[k]; });
        }

        /* [Detección #4] Feedback en vivo de coincidencia de contraseñas.
         * Se ejecuta en cada input de #new-password o #confirm-password.
         * Los estados son:
         *   · confirm vacío         → neutral (hint vacío, sin borde)
         *   · confirm lleno y match → verde
         *   · confirm lleno y !match → rojo */
        function actualizarFeedbackMatch() {
            if (!elNewPassword || !elConfirmPassword) return;
            var nueva = elNewPassword.value;
            var confirm = elConfirmPassword.value;

            /* Limpiar clases previas. */
            elConfirmPassword.classList.remove('input-match', 'input-mismatch');
            if (elConfirmHint) {
                elConfirmHint.classList.remove('match', 'mismatch');
                elConfirmHint.textContent = '';
            }

            if (!confirm) return; // neutral

            if (nueva === confirm) {
                elConfirmPassword.classList.add('input-match');
                if (elConfirmHint) {
                    elConfirmHint.textContent = '✓ Las contraseñas coinciden';
                    elConfirmHint.classList.add('match');
                }
            } else {
                elConfirmPassword.classList.add('input-mismatch');
                if (elConfirmHint) {
                    elConfirmHint.textContent = '✗ Las contraseñas no coinciden';
                    elConfirmHint.classList.add('mismatch');
                }
            }
        }

        /* [Detección #3] Limpiar el mensaje de error global al reescribir.
         * Evita que el usuario vea "Las contraseñas no coinciden" mientras
         * ya está corrigiendo el input. */
        function limpiarErrorGlobal() {
            if (elErrorMsg && elErrorMsg.textContent) {
                elErrorMsg.textContent = '';
            }
        }

        /* ============================================================ */
        /* 5. VERIFICACIÓN DEL oobCode                                  */
        /* ============================================================ */
        /* Usa verifyPasswordResetCode (API específica para reset de    */
        /* contraseña). NO usa checkActionCode(href) que era el bug     */
        /* original: pasaba la URL completa en vez del oobCode, y esa   */
        /* API no está diseñada para reset de contraseña.               */
        function verificarEnlace() {
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode');
            var oobCode = params.get('oobCode');

            if (!oobCode) {
                mostrarErrorLink(
                    'El enlace no contiene un código de recuperación. ' +
                    'Solicitá uno nuevo desde la app.'
                );
                return;
            }

            if (mode && mode !== 'resetPassword') {
                mostrarErrorLink(
                    'Este enlace no es válido para restablecer una contraseña.'
                );
                return;
            }

            /* verifyPasswordResetCode + timeout. Evita que la UI se
             * quede colgada si Firebase no responde (red lenta, DNS,
             * bloqueadores). */
            var verificacion = auth.verifyPasswordResetCode(oobCode);
            var timeout = new Promise(function (_, reject) {
                setTimeout(function () {
                    reject(new Error('timeout'));
                }, OOB_VERIFY_TIMEOUT_MS);
            });

            Promise.race([verificacion, timeout])
                .then(function (email) {
                    actionCode = oobCode;

                    if (elSubtitle) {
                        elSubtitle.textContent = email
                            ? 'Restablecer contraseña para: ' + email
                            : 'Ingresá tu nueva contraseña';
                    }

                    /* Limpiar el URL: sacamos el oobCode de la barra de
                     * direcciones y del historial. Ya lo tenemos en
                     * memoria (actionCode). */
                    try {
                        window.history.replaceState(
                            {},
                            document.title,
                            window.location.pathname
                        );
                    } catch (e) { /* Navegadores muy viejos, ignorar. */ }

                    mostrarVista('form');

                    /* Focus programático: el input estaba oculto, no
                     * puede usar autofocus declarativo. */
                    if (elNewPassword) {
                        setTimeout(function () {
                            try { elNewPassword.focus(); } catch (e) {}
                        }, 60);
                    }
                })
                .catch(function (error) {
                    /* [Detección #8] Diferenciar timeout de error real.
                     * Un timeout (>10s) NO es lo mismo que un enlace
                     * inválido: el primero sugiere red lenta, el segundo
                     * sugiere código vencido o manipulado. El mensaje
                     * al usuario debe reflejar esa diferencia. */
                    var esTimeout = (error && error.message === 'timeout');
                    console.warn('[Reset] Error al verificar oobCode:',
                                 esTimeout
                                   ? 'timeout'
                                   : ((error && error.code) || (error && error.message) || 'unknown'));

                    if (esTimeout) {
                        mostrarErrorLink(
                            'La verificación tardó demasiado. Revisá tu conexión ' +
                            'a internet y recargá la página para reintentar.'
                        );
                    } else {
                        mostrarErrorLink(
                            'El enlace de recuperación es inválido o ya expiró. ' +
                            'Solicitá uno nuevo desde la app.'
                        );
                    }
                });
        }

        /* ============================================================ */
        /* 6. SUBMIT — CAMBIO DE CONTRASEÑA                             */
        /* ============================================================ */
        function onSubmit(e) {
            e.preventDefault();

            if (isSubmitting) return;

            var newPassword = elNewPassword ? elNewPassword.value : '';
            var confirmPassword = elConfirmPassword ? elConfirmPassword.value : '';

            if (elErrorMsg) elErrorMsg.textContent = '';

            if (!validarContrasena(newPassword)) {
                if (elErrorMsg) elErrorMsg.textContent =
                    'La contraseña no cumple con todos los requisitos.';
                return;
            }

            if (newPassword !== confirmPassword) {
                if (elErrorMsg) elErrorMsg.textContent =
                    'Las contraseñas no coinciden.';
                return;
            }

            if (!actionCode) {
                if (elErrorMsg) elErrorMsg.textContent =
                    'El enlace de recuperación es inválido. Solicitá uno nuevo.';
                return;
            }

            isSubmitting = true;
            if (elBtnSubmit) {
                elBtnSubmit.disabled = true;
                elBtnSubmit.innerHTML = '<span class="spinner" aria-hidden="true"></span>Actualizando...';
            }

            /* [Detección #5] Deshabilitar los toggle de contraseña durante
             * el submit. Evita que el usuario cambie la visibilidad mientras
             * la operación está en curso. */
            document.querySelectorAll('.toggle-password').forEach(function (b) {
                b.disabled = true;
            });

            auth.confirmPasswordReset(actionCode, newPassword)
                .then(function () {
                    mostrarVista('success');
                })
                .catch(function (error) {
                    var code = (error && error.code) || '';
                    /* Log limpio: solo el code, nunca el objeto completo. */
                    console.warn('[Reset] Error al confirmar reset:', code);

                    var msg = 'No se pudo actualizar la contraseña. Intentá nuevamente.';
                    if (code === 'auth/expired-action-code') {
                        msg = 'El enlace ha expirado. Solicitá uno nuevo.';
                    } else if (code === 'auth/invalid-action-code') {
                        msg = 'El enlace es inválido. Solicitá uno nuevo.';
                    } else if (code === 'auth/weak-password') {
                        msg = 'La contraseña es demasiado débil. Probá con una más fuerte.';
                    } else if (code === 'auth/user-disabled') {
                        msg = 'Esta cuenta está deshabilitada. Contactá al administrador.';
                    } else if (code === 'auth/user-not-found') {
                        msg = 'La cuenta asociada ya no existe.';
                    } else if (code === 'auth/network-request-failed') {
                        msg = 'Sin conexión. Revisá tu internet e intentá de nuevo.';
                    } else if (code === 'auth/too-many-requests') {
                        msg = 'Demasiados intentos. Esperá unos minutos antes de reintentar.';
                    }
                    if (elErrorMsg) elErrorMsg.textContent = msg;
                })
                .finally(function () {
                    isSubmitting = false;
                    if (elBtnSubmit) {
                        elBtnSubmit.disabled = false;
                        elBtnSubmit.textContent = 'Actualizar Contraseña';
                    }
                    document.querySelectorAll('.toggle-password').forEach(function (b) {
                        b.disabled = false;
                    });
                });
        }

        /* ============================================================ */
        /* 7. TOGGLE DE CONTRASEÑA                                      */
        /* ============================================================ */
        document.querySelectorAll('.toggle-password').forEach(function (btn) {
            btn.addEventListener('click', function () {
                /* [Detección #5] No hacer nada si hay un submit en curso. */
                if (isSubmitting) return;

                var targetId = btn.dataset.target;
                if (!targetId) return;
                var input = document.getElementById(targetId);
                if (!input) return;

                if (input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = '🙈';
                    btn.setAttribute('aria-label', 'Ocultar contraseña');
                } else {
                    input.type = 'password';
                    btn.textContent = '👁️';
                    btn.setAttribute('aria-label', 'Mostrar contraseña');
                }
            });
        });

        /* ============================================================ */
        /* 8. LISTENERS                                                 */
        /* ============================================================ */
        /* [Detección #3 + #4] En cada input de contraseña:
         *   · validar requisitos en vivo (solo para #new-password)
         *   · actualizar feedback de coincidencia
         *   · limpiar el mensaje de error global */
        if (elNewPassword) {
            elNewPassword.addEventListener('input', function (e) {
                validarContrasena(e.target.value);
                actualizarFeedbackMatch();
                limpiarErrorGlobal();
            });
        }

        if (elConfirmPassword) {
            elConfirmPassword.addEventListener('input', function () {
                actualizarFeedbackMatch();
                limpiarErrorGlobal();
            });
        }

        if (elFormReset) {
            elFormReset.addEventListener('submit', onSubmit);
        }

        /* ============================================================ */
        /* 9. INIT                                                      */
        /* ============================================================ */
        verificarEnlace();

    })();
    </script>
</body>
</html>
