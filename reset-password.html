<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mejora 2 - Recuperar Contraseña</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }
        
        .form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .input-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #999;
            padding: 5px;
        }
        
        .toggle-password:hover {
            color: #667eea;
        }
        
        .password-requirements {
            font-size: 11px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        
        .requirement {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #888;
            transition: color 0.2s;
        }
        
        .requirement.valid { color: #2a9d4a; }
        .requirement.invalid { color: #d33; }
        
        .requirement::before {
            content: '○';
            font-size: 10px;
        }
        
        .requirement.valid::before { content: '✓'; }
        .requirement.invalid::before { content: '✗'; }
        
        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
            text-align: center;
            display: block;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .error {
            color: #d33;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }
        
        .success {
            color: #2a9d4a;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Nueva Contraseña</h1>
        <p class="subtitle">Ingresá tu nueva contraseña</p>
        
        <div id="view-form">
            <form id="form-reset" class="form">
                <div class="form-group">
                    <label for="new-password">Nueva Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="new-password" required placeholder="Mínimo 8 caracteres" autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="new-password">👁️</button>
                    </div>
                    <div class="password-requirements">
                        <div class="requirement" id="req-length">Mínimo 8 caracteres</div>
                        <div class="requirement" id="req-uppercase">Una mayúscula (A-Z)</div>
                        <div class="requirement" id="req-lowercase">Una minúscula (a-z)</div>
                        <div class="requirement" id="req-number">Un número (0-9)</div>
                        <div class="requirement" id="req-symbol">Un símbolo (!@#$%^&*)</div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" required placeholder="Repetí la contraseña" autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="confirm-password">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-submit">Actualizar Contraseña</button>
            </form>
            <p id="error-msg" class="error"></p>
        </div>
        
        <div id="view-success" class="hidden">
            <p class="success" style="font-size: 16px; margin-bottom: 20px;">✅ Tu contraseña fue actualizada correctamente.</p>
            <a href="https://arboldelostero.github.io/Mejora2/" class="btn btn-primary" style="text-decoration: none; text-align: center; display: block;">Volver al Login</a>
        </div>
        
        <div id="view-error" class="hidden">
            <p id="error-link-msg" class="error" style="font-size: 14px; margin-bottom: 20px;"></p>
            <a href="https://arboldelostero.github.io/Mejora2/" class="btn btn-secondary">Volver al Login</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBKqZH1mF983q04o8_XtuE7waF3tlBeXnI",
            authDomain: "mejora2-9eec7.firebaseapp.com",
            projectId: "mejora2-9eec7",
            storageBucket: "mejora2-9eec7.firebasestorage.app",
            messagingSenderId: "892721742749",
            appId: "1:892721742749:web:f37fa5364d2bc190736574"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let actionCode = null;

        function validarContrasena(password) {
            const checks = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                symbol: /[@$!%*?&]/.test(password)
            };
            
            document.getElementById('req-length').className = 'requirement ' + (checks.length ? 'valid' : 'invalid');
            document.getElementById('req-uppercase').className = 'requirement ' + (checks.uppercase ? 'valid' : 'invalid');
            document.getElementById('req-lowercase').className = 'requirement ' + (checks.lowercase ? 'valid' : 'invalid');
            document.getElementById('req-number').className = 'requirement ' + (checks.number ? 'valid' : 'invalid');
            document.getElementById('req-symbol').className = 'requirement ' + (checks.symbol ? 'valid' : 'invalid');
            
            return Object.values(checks).every(v => v);
        }

        function verificarCodigoAccion() {
            auth.checkActionCode(window.location.href)
                .then(actionCodeInfo => {
                    if (actionCodeInfo.data && actionCodeInfo.data.email) {
                        document.querySelector('.subtitle').textContent = 
                            `Restablecer contraseña para: ${actionCodeInfo.data.email}`;
                    }
                    actionCode = new URLSearchParams(window.location.search).get('oobCode');
                    if (!actionCode) {
                        mostrarErrorLink('El enlace de recuperación es inválido o ha expirado.');
                    }
                })
                .catch(error => {
                    console.error('Error al verificar código:', error);
                    mostrarErrorLink('El enlace de recuperación es inválido o ha expirado. Solicitá uno nuevo.');
                });
        }

        function mostrarErrorLink(msg) {
            document.getElementById('view-form').classList.add('hidden');
            document.getElementById('view-error').classList.remove('hidden');
            document.getElementById('error-link-msg').textContent = msg;
        }

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                const input = document.getElementById(targetId);
                if (input.type === 'password') {
                    input.type = 'text';
                    btn.textContent = '🙈';
                } else {
                    input.type = 'password';
                    btn.textContent = '👁️';
                }
            });
        });

        document.getElementById('new-password').addEventListener('input', (e) => {
            validarContrasena(e.target.value);
        });

        document.getElementById('form-reset').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('error-msg');
            const btnSubmit = document.getElementById('btn-submit');
            
            errorEl.textContent = '';
            
            if (!validarContrasena(newPassword)) {
                errorEl.textContent = 'La contraseña no cumple con los requisitos.';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                errorEl.textContent = 'Las contraseñas no coinciden.';
                return;
            }
            
            if (!actionCode) {
                errorEl.textContent = 'El enlace de recuperación es inválido.';
                return;
            }
            
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner"></span>Actualizando...';
            
            try {
                await auth.confirmPasswordReset(actionCode, newPassword);
                document.getElementById('view-form').classList.add('hidden');
                document.getElementById('view-success').classList.remove('hidden');
            } catch (error) {
                console.error('Error al restablecer contraseña:', error);
                if (error.code === 'auth/expired-action-code') {
                    errorEl.textContent = 'El enlace ha expirado. Solicitá uno nuevo.';
                } else if (error.code === 'auth/invalid-action-code') {
                    errorEl.textContent = 'El enlace es inválido. Solicitá uno nuevo.';
                } else if (error.code === 'auth/weak-password') {
                    errorEl.textContent = 'La contraseña es demasiado débil.';
                } else {
                    errorEl.textContent = 'Error al actualizar la contraseña. Intentá nuevamente.';
                }
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Actualizar Contraseña';
            }
        });

        verificarCodigoAccion();
    </script>
</body>
</html>
