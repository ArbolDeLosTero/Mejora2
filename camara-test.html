<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Cámara</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f0f0; }
        #reader { 
            width: 100%; 
            max-width: 400px; 
            min-height: 300px; 
            background: #000; 
            margin: 20px auto; 
            border-radius: 12px; 
            overflow: hidden; 
        }
        /* Forzar al video a ocupar todo el contenedor */
        #reader video { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important; 
        }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            margin: 5px; 
        }
        .btn-start { background: #2a9d4a; color: white; }
        .btn-stop { background: #d33; color: white; }
        #resultado { margin-top: 20px; font-weight: bold; color: #333; word-break: break-all; }
    </style>
</head>
<body>
    <h2>📷 Prueba de Cámara Independiente</h2>
    <p>Si ves tu entorno aquí, la cámara funciona.</p>
    
    <div id="reader"></div>
    
    <button class="btn-start" onclick="iniciar()">▶ Iniciar Cámara</button>
    <button class="btn-stop" onclick="detener()">⏹ Detener</button>
    
    <div id="resultado">Esperando escaneo...</div>

    <script>
        let scanner = null;

        async function iniciar() {
            document.getElementById("resultado").innerText = "Iniciando cámara...";
            try {
                scanner = new Html5Qrcode("reader");
                await scanner.start(
                    { facingMode: "environment" }, // Usa la cámara trasera
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (codigo) => {
                        // ¡Éxito al escanear!
                        document.getElementById("resultado").innerText = "✅ ESCANEADO: " + codigo;
                        // Opcional: detener después de leer uno
                        // detener(); 
                    },
                    (error) => {
                        // Ignorar errores de "no detectado" mientras busca
                    }
                );
                document.getElementById("resultado").innerText = "Cámara activa. Apunta a un código.";
            } catch (err) {
                document.getElementById("resultado").innerText = "❌ ERROR: " + err;
                console.error(err);
            }
        }

        async function detener() {
            if (scanner) {
                await scanner.stop();
                scanner.clear();
                scanner = null;
                document.getElementById("resultado").innerText = "Cámara detenida.";
            }
        }
    </script>
</body>
</html>
