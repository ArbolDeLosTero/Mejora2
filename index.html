
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                body {
                  background-color: white; /* Ensure the iframe has a white background */
                }

                /* PANEL-02: LICENCIAS */
.licencia-container {
    background: #fff;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    max-width: 500px;
    margin: 0 auto;
}

.licencia-container h1 {
    font-size: 28px;
    color: #333;
    margin-bottom: 10px;
    text-align: center;
}

.licencia-subtitle {
    font-size: 14px;
    color: #666;
    text-align: center;
    margin-bottom: 25px;
}

.licencia-section {
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid #e0e0e0;
}

.licencia-section:last-child {
    border-bottom: none;
}

.licencia-section h3 {
    font-size: 16px;
    color: #667eea;
    margin-bottom: 15px;
    font-weight: 600;
}

.device-id-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f8f9fa;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
}

.device-id-text {
    flex: 1;
    font-size: 20px;
    font-weight: 600;
    color: #333;
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
}

.btn-icon {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 5px;
    transition: transform 0.2s;
}

.btn-icon:hover {
    transform: scale(1.2);
}

.licencia-info {
    font-size: 12px;
    color: #666;
    text-align: center;
    margin-bottom: 15px;
}

.btn-whatsapp {
    background: #25D366;
    color: #fff;
    width: 100%;
    margin-bottom: 10px;
}

.btn-whatsapp:hover {
    background: #20BA5A;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
}

.input-licencia {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    resize: vertical;
    transition: border-color 0.2s;
}

.input-licencia:focus {
    outline: none;
    border-color: #667eea;
}

.licencia-detalles {
    background: #f8f9fa;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.detalle-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #e0e0e0;
}

.detalle-item:last-child {
    border-bottom: none;
}

.detalle-label {
    font-size: 13px;
    color: #666;
    font-weight: 500;
}

.detalle-valor {
    font-size: 13px;
    color: #333;
    font-weight: 600;
}

.licencia-error {
    color: #d33;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    min-height: 20px;
}

.licencia-success {
    color: #2a9d4a;
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
    min-height: 20px;
}


              </style>
                        </head>
                        <body>
                            <!-- PANEL-02: LICENCIAS -->
<div id="vista-licencia" class="vista">
    <div class="licencia-container">
        <h1>🔑 Activar Licencia</h1>
        <p class="licencia-subtitle">Vinculá tu dispositivo para usar Mejora 2</p>
        
        <!-- Sección Device ID -->
        <div class="licencia-section">
            <h3>📱 Device ID de este dispositivo</h3>
            <div class="device-id-box">
                <span id="device-id-display" class="device-id-text">Generando...</span>
                <button id="btn-copiar-device-id" class="btn-icon" title="Copiar Device ID">📋</button>
            </div>
            <p class="licencia-info">Enviá este código por WhatsApp para recibir tu clave de licencia</p>
            <button id="btn-whatsapp" class="btn btn-whatsapp">
                💬 Enviar por WhatsApp
            </button>
        </div>

        <!-- Sección Activación -->
        <div class="licencia-section">
            <h3>🔑 Clave de Licencia</h3>
            <div class="form-group">
                <textarea id="txt-clave-licencia" class="input-licencia" placeholder="Pegá aquí tu clave de licencia..." rows="4"></textarea>
            </div>
            <button id="btn-activar-licencia" class="btn btn-primary">
                Activar Licencia
            </button>
        </div>

        <!-- Sección Información de Licencia (oculta hasta activar) -->
        <div id="licencia-info-panel" class="licencia-section" style="display:none;">
            <h3>✅ Licencia Activa</h3>
            <div class="licencia-detalles">
                <div class="detalle-item">
                    <span class="detalle-label">Cliente:</span>
                    <span id="lic-cliente" class="detalle-valor">-</span>
                </div>
                <div class="detalle-item">
                    <span class="detalle-label">Tipo:</span>
                    <span id="lic-tipo" class="detalle-valor">-</span>
                </div>
                <div class="detalle-item">
                    <span class="detalle-label">Expiración:</span>
                    <span id="lic-expiracion" class="detalle-valor">-</span>
                </div>
                <div class="detalle-item">
                    <span class="detalle-label">Días offline:</span>
                    <span id="lic-offline" class="detalle-valor">-</span>
                </div>
                <div class="detalle-item">
                    <span class="detalle-label">Última validación:</span>
                    <span id="lic-ultima-validacion" class="detalle-valor">-</span>
                </div>
            </div>
            <button id="btn-validar-ahora" class="btn btn-secondary">
                🔄 Validar Ahora
            </button>
        </div>

        <p id="licencia-error" class="licencia-error"></p>
        <p id="licencia-success" class="licencia-success"></p>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>


              <script>
                              // PANEL-02: LICENCIAS
// REQUISITO: Firebase ya inicializado en PANEL-01
// REQUISITO: CryptoJS cargado en el <head>

const licenciaState = {
    deviceId: null,
    licenciaActiva: false,
    licenciaDatos: null
};

// Función global de navegación entre paneles
function mostrarVista(nombreVista) {
    console.log(`[Router] Navegando a: ${nombreVista}`);
    
    document.querySelectorAll('.vista').forEach(v => {
        v.classList.remove('activa');
        v.style.display = 'none';
    });
    
    const mapaVistas = {
        'auth': 'vista-auth',
        'licencia': 'vista-licencia',
        'licencia-requerida': 'vista-licencia',
        'menu-principal': 'vista-menu'
    };
    
    const vistaId = mapaVistas[nombreVista];
    
    if (vistaId) {
        const target = document.getElementById(vistaId);
        if (target) {
            target.classList.add('activa');
            target.style.display = 'block';
            
            if (nombreVista === 'licencia' || nombreVista === 'licencia-requerida') {
                if (typeof initLicenciaPanel === 'function') {
                    initLicenciaPanel();
                }
            }
        } else {
            console.error(`[Router] Vista no encontrada: ${vistaId}`);
        }
    } else {
        console.error(`[Router] Nombre de vista no mapeado: ${nombreVista}`);
    }
}

// Generar UUID v4
function generarUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

// Generar Device ID en formato M2-XXXX
function generarDeviceId() {
    const uuid = generarUUID();
    const codigo = uuid.substring(0, 4).toUpperCase();
    return `M2-${codigo}`;
}

// Obtener o crear Device ID desde Firestore
async function obtenerDeviceId() {
    const usuarioActual = JSON.parse(localStorage.getItem('usuario_actual_v1'));
    
    if (!usuarioActual || !usuarioActual.uid) {
        throw new Error('Usuario no autenticado');
    }

    // Consultar Firestore para ver si ya tiene Device ID
    const userDoc = await db.collection('usuarios').doc(usuarioActual.uid).get();
    
    if (userDoc.exists && userDoc.data().device_id) {
        // Ya tiene Device ID en Firestore
        licenciaState.deviceId = userDoc.data().device_id;
        localStorage.setItem('device_id_v1', licenciaState.deviceId);
        return licenciaState.deviceId;
    }

    // No tiene Device ID, generar uno nuevo
    const nuevoDeviceId = generarDeviceId();
    licenciaState.deviceId = nuevoDeviceId;
    
    // Guardar en Firestore y localStorage
    await db.collection('usuarios').doc(usuarioActual.uid).update({
        device_id: nuevoDeviceId
    });
    
    localStorage.setItem('device_id_v1', nuevoDeviceId);
    
    return nuevoDeviceId;
}

// Desencriptar JWT (payload en base64)
function desencriptarJWT(jwt) {
    try {
        const partes = jwt.split('.');
        if (partes.length !== 3) {
            throw new Error('Formato de JWT inválido');
        }

        // Decodificar payload (base64)
        const payloadBase64 = partes[1];
        const payloadJson = atob(payloadBase64);
        const payload = JSON.parse(payloadJson);

        // Verificar estructura del payload
        if (!payload.device_id || !payload.fecha_expiracion || !payload.dias_offline) {
            throw new Error('Payload de licencia inválido');
        }

        return {
            valido: true,
            payload: payload,
            signature: partes[2]
        };
    } catch (error) {
        console.error('Error al desencriptar JWT:', error);
        return { valido: false, error: error.message };
    }
}

// Verificar licencia en Firestore
async function verificarLicenciaEnFirestore(jwtHash, deviceId) {
    try {
        const licenciaDoc = await db.collection('licencias').doc(jwtHash).get();
        
        if (!licenciaDoc.exists) {
            return { valida: false, motivo: 'Licencia no encontrada' };
        }

        const licenciaData = licenciaDoc.data();
        
        if (!licenciaData.activa) {
            return { valida: false, motivo: 'Licencia deshabilitada' };
        }

        if (licenciaData.device_id !== deviceId) {
            return { valida: false, motivo: 'Device ID no coincide' };
        }

        return { valida: true, datos: licenciaData };
    } catch (error) {
        console.error('Error al verificar licencia:', error);
        return { valida: false, motivo: 'Error de conexión' };
    }
}

// Calcular hash SHA-256 del JWT
function calcularHashJWT(jwt) {
    return CryptoJS.SHA256(jwt).toString();
}

// Activar licencia
async function activarLicencia() {
    const txtClave = document.getElementById('txt-clave-licencia');
    const btnActivar = document.getElementById('btn-activar-licencia');
    const errorEl = document.getElementById('licencia-error');
    const successEl = document.getElementById('licencia-success');
    
    const jwt = txtClave.value.trim();
    
    errorEl.textContent = '';
    successEl.textContent = '';
    
    if (!jwt) {
        errorEl.textContent = 'Ingresá una clave de licencia';
        return;
    }
    
    if (!licenciaState.deviceId) {
        errorEl.textContent = 'Device ID no disponible';
        return;
    }
    
    btnActivar.disabled = true;
    btnActivar.innerHTML = '<span class="spinner"></span>Activando...';
    
    try {
        // Paso 1: Desencriptar JWT localmente
        const resultadoDesencriptacion = desencriptarJWT(jwt);
        
        if (!resultadoDesencriptacion.valido) {
            throw new Error('Clave de licencia inválida');
        }
        
        const payload = resultadoDesencriptacion.payload;
        
        // Paso 2: Verificar Device ID
        if (payload.device_id !== licenciaState.deviceId) {
            throw new Error('Esta licencia no corresponde a este dispositivo');
        }
        
        // Paso 3: Verificar fecha de expiración
        const fechaExpiracion = new Date(payload.fecha_expiracion);
        if (fechaExpiracion < new Date()) {
            throw new Error('La licencia ha expirado');
        }
        
        // Paso 4: Calcular hash del JWT y verificar en Firestore
        const jwtHash = calcularHashJWT(jwt);
        const verificacionFirestore = await verificarLicenciaEnFirestore(jwtHash, licenciaState.deviceId);
        
        if (!verificacionFirestore.valida) {
            throw new Error(verificacionFirestore.motivo);
        }
        
        // Paso 5: Guardar licencia en localStorage
        const licenciaDatos = {
            cliente: payload.cliente,
            tipo: payload.tipo,
            fecha_expiracion: payload.fecha_expiracion,
            dias_offline: payload.dias_offline,
            device_id: payload.device_id,
            jwt_hash: jwtHash
        };
        
        localStorage.setItem('licencia_v1', 'activa');
        localStorage.setItem('licencia_datos_v1', JSON.stringify(licenciaDatos));
        localStorage.setItem('licencia_ultima_validacion', Date.now().toString());
        
        // Paso 6: Actualizar Firestore
        const usuarioActual = JSON.parse(localStorage.getItem('usuario_actual_v1'));
        await db.collection('usuarios').doc(usuarioActual.uid).update({
            licencia_activa: true,
            fecha_activacion: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Paso 7: Mostrar éxito
        licenciaState.licenciaActiva = true;
        licenciaState.licenciaDatos = licenciaDatos;
        
        successEl.textContent = '¡Licencia activada correctamente!';
        txtClave.value = '';
        
        // Mostrar información de licencia
        mostrarInformacionLicencia(licenciaDatos);
        
    } catch (error) {
        console.error('Error al activar licencia:', error);
        errorEl.textContent = 'Error de validación de licencia';
    } finally {
        btnActivar.disabled = false;
        btnActivar.textContent = 'Activar Licencia';
    }
}

// Mostrar información de licencia
function mostrarInformacionLicencia(datos) {
    document.getElementById('licencia-info-panel').style.display = 'block';
    document.getElementById('lic-cliente').textContent = datos.cliente || '-';
    document.getElementById('lic-tipo').textContent = datos.tipo || '-';
    
    const fechaExpiracion = new Date(datos.fecha_expiracion);
    document.getElementById('lic-expiracion').textContent = fechaExpiracion.toLocaleDateString('es-AR');
    
    document.getElementById('lic-offline').textContent = `${datos.dias_offline} días`;
    
    const ultimaValidacion = new Date(parseInt(localStorage.getItem('licencia_ultima_validacion')));
    document.getElementById('lic-ultima-validacion').textContent = ultimaValidacion.toLocaleString('es-AR');
}

// Validar licencia (forzar validación online)
async function validarLicenciaAhora() {
    const btnValidar = document.getElementById('btn-validar-ahora');
    const errorEl = document.getElementById('licencia-error');
    
    errorEl.textContent = '';
    
    btnValidar.disabled = true;
    btnValidar.innerHTML = '<span class="spinner"></span>Validando...';
    
    try {
        const licenciaDatos = JSON.parse(localStorage.getItem('licencia_datos_v1'));
        
        if (!licenciaDatos) {
            throw new Error('No hay licencia activa');
        }
        
        // Verificar en Firestore
        const verificacion = await verificarLicenciaEnFirestore(licenciaDatos.jwt_hash, licenciaState.deviceId);
        
        if (!verificacion.valida) {
            throw new Error(verificacion.motivo);
        }
        
        // Actualizar timestamp
        localStorage.setItem('licencia_ultima_validacion', Date.now().toString());
        
        // Actualizar UI
        const ultimaValidacion = new Date();
        document.getElementById('lic-ultima-validacion').textContent = ultimaValidacion.toLocaleString('es-AR');
        
        alert('Licencia validada correctamente');
        
    } catch (error) {
        console.error('Error al validar licencia:', error);
        errorEl.textContent = 'Error de validación de licencia';
    } finally {
        btnValidar.disabled = false;
        btnValidar.textContent = ' Validar Ahora';
    }
}

// Inicializar Panel de Licencias
async function initLicenciaPanel() {
    try {
        // Obtener o crear Device ID
        const deviceId = await obtenerDeviceId();
        document.getElementById('device-id-display').textContent = deviceId;
        
        // Verificar si ya tiene licencia activa
        const licenciaEstado = localStorage.getItem('licencia_v1');
        
        if (licenciaEstado === 'activa') {
            const licenciaDatos = JSON.parse(localStorage.getItem('licencia_datos_v1'));
            licenciaState.licenciaActiva = true;
            licenciaState.licenciaDatos = licenciaDatos;
            mostrarInformacionLicencia(licenciaDatos);
        }
        
        // Event Listeners (solo si no están ya registrados)
        if (!document.getElementById('btn-copiar-device-id').dataset.initialized) {
            document.getElementById('btn-copiar-device-id').addEventListener('click', () => {
                navigator.clipboard.writeText(deviceId).then(() => {
                    alert('Device ID copiado al portapapeles');
                }).catch(err => {
                    console.error('Error al copiar:', err);
                });
            });
            document.getElementById('btn-copiar-device-id').dataset.initialized = 'true';
        }
        
        if (!document.getElementById('btn-whatsapp').dataset.initialized) {
            document.getElementById('btn-whatsapp').addEventListener('click', () => {
                const mensaje = `Mi Device ID para Mejora 2 es: ${deviceId}`;
                const url = `https://wa.me/5491125816992?text=${encodeURIComponent(mensaje)}`;
                window.open(url, '_blank');
            });
            document.getElementById('btn-whatsapp').dataset.initialized = 'true';
        }
        
        if (!document.getElementById('btn-activar-licencia').dataset.initialized) {
            document.getElementById('btn-activar-licencia').addEventListener('click', activarLicencia);
            document.getElementById('btn-activar-licencia').dataset.initialized = 'true';
        }
        
        if (!document.getElementById('btn-validar-ahora').dataset.initialized) {
            document.getElementById('btn-validar-ahora').addEventListener('click', validarLicenciaAhora);
            document.getElementById('btn-validar-ahora').dataset.initialized = 'true';
        }
        
    } catch (error) {
        console.error('Error al inicializar panel de licencias:', error);
        document.getElementById('licencia-error').textContent = 'Error al cargar el panel';
    }
}


              </script>
                        </body>
                        </html>
