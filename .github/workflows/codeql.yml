# ═══════════════════════════════════════════════════════════════════════
# Workflow: CodeQL — Análisis estático de seguridad
# Repo:     ArbolDeLosTero/Mejora2
# Archivo:  .github/workflows/codeql.yml
# ───────────────────────────────────────────────────────────────────────
# Changelog:
#   2026-10-11 — Reescritura completa. Correcciones aplicadas:
#     🔴 SHA verificados contra los releases oficiales:
#        - actions/checkout v4.3.1  → 34e114876b0b11c390a56381ad16ebd13914f8d5
#        - github/codeql-action v3.37.9 → 6f5948dfacef28e207b48d0905cf90c03365536d
#     🟠 timeout-minutes: 60 (antes: 360 = default de GitHub, no aportaba
#        nada; ahora un cuelgue se cancela en 1 hora en vez de 6).
#     🟠 Agregado `if:` para saltar PRs desde forks (antes: el workflow
#        fallaba en rojo cuando un PR externo intentaba subir SARIF con
#        un token degradado a solo lectura).
#     🟠 paths ampliados: cubre cualquier .js/.mjs/.cjs del repo (antes:
#        solo functions/**/*.js) + functions/package-lock.json.
#     🟡 concurrency con cancelación selectiva: en PRs cancela el
#        análisis viejo (deseable), en main acumula análisis (antes:
#        cancelaba en main, perdiendo el análisis de commits intermedios).
#     🟡 permissions movidos de nivel workflow a nivel job (antes: si se
#        agregaba un segundo job, heredaba permisos innecesarios).
#     🟡 Exclusión de node_modules ampliada a `**/node_modules/**`
#        (antes: solo functions/node_modules/**).
#     🟡 `if:` simplificado a negación directa (`!github.event...`).
# ───────────────────────────────────────────────────────────────────────
# NOTA sobre los SHA:
#   Verificados contra los releases oficiales el 2026-10-11.
#   Dependabot (configurado en .github/dependabot.yml) va a proponer
#   actualizaciones automáticas de estos SHA vía PRs semanales.
# ═══════════════════════════════════════════════════════════════════════

name: "CodeQL"

# ─── Triggers ──────────────────────────────────────────────────────────
on:
  # En cada push a main que toque código analizable.
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'index.html'
      - 'reset-password.html'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/codeql.yml'
      - '!**/node_modules/**'
      - '!**/*.min.js'

  # En cada PR contra main que toque código analizable.
  pull_request:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'index.html'
      - 'reset-password.html'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - '.github/workflows/codeql.yml'
      - '!**/node_modules/**'
      - '!**/*.min.js'

  # Análisis semanal programado: lunes 06:00 UTC = lunes 03:00 ART.
  schedule:
    - cron: '0 6 * * 1'

  # Permite disparar el workflow manualmente desde la UI de GitHub.
  workflow_dispatch:

# ─── Concurrencia ──────────────────────────────────────────────────────
# En PRs: cancela el análisis anterior del mismo PR (el commit viejo ya
# no importa). En main: NO cancela, porque cada commit a main es una
# foto permanente del código en producción.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ─── Job ───────────────────────────────────────────────────────────────
jobs:
  analyze:
    name: Analizar JavaScript
    runs-on: ubuntu-latest

    # GitHub Actions default es 360 minutos (6 horas). Un análisis de
    # CodeQL sobre ~15.000 líneas de JS tarda 5-15 minutos. 60 minutos
    # da margen 4x y evita que un cuelgue bloquee la cola por horas.
    timeout-minutes: 60

    # En PRs desde forks, el GITHUB_TOKEN se degrada a solo lectura y
    # no puede subir SARIF. Saltamos esos PRs para que el workflow no
    # quede en rojo sin razón. El análisis corre igual en push a main.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork

    # Permisos a nivel job (no workflow) para que futuros jobs no
    # hereden permisos innecesarios. Principio de menor privilegio.
    permissions:
      contents: read         # checkout del repo
      actions: read          # leer metadata de workflows previos
      security-events: write # subir SARIF a la pestaña Security
      pull-requests: write   # comentar hallazgos inline en PRs

    steps:
      # 1. Checkout del repositorio.
      - name: Checkout del repositorio
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # 2. Inicialización de CodeQL.
      #    - `languages: javascript` cubre index.html (JS inline),
      #      reset-password.html y functions/**/*.js.
      #    - `queries: security-extended` agrega queries extra de
      #      seguridad al set por defecto.
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: javascript
          queries: +security-extended

      # 3. Análisis + subida de resultados SARIF.
      #    No hay step `autobuild` porque JavaScript no se compila.
      #    `category` permite distinguir resultados si en el futuro se
      #    agregan más lenguajes al mismo workflow.
      - name: Analizar
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:javascript"
