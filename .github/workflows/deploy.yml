name: Deploy con Auto-Versionado a GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos necesarios:
# - contents: write  → para hacer commit del version.json incrementado
# - pages: write     → para deployar a GitHub Pages
# - id-token: write  → para autenticación OIDC de Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  bump-and-deploy:
    # Salta el workflow si el commit es automático (evita loops infinitos)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Incrementar versión en version.json
        run: |
          # Leer versión actual
          VERSION_ACTUAL=$(jq -r '.version' version.json)
          echo "Versión actual: $VERSION_ACTUAL"

          # Separar en MAYOR.MENOR.PARCHE
          IFS='.' read -ra PARTS <<< "$VERSION_ACTUAL"
          MAJOR="${PARTS[0]}"
          MINOR="${PARTS[1]}"
          PATCH="${PARTS[2]}"

          # Incrementar solo el patch (1.0.0 → 1.0.1)
          PATCH_NUEVO=$((PATCH + 1))
          VERSION_NUEVA="$MAJOR.$MINOR.$PATCH_NUEVO"
          echo "Nueva versión: $VERSION_NUEVA"

          # Fecha de hoy
          FECHA=$(date -u +%Y-%m-%d)

          # Actualizar version.json preservando las notas
          jq --arg v "$VERSION_NUEVA" --arg f "$FECHA" \
             '.version = $v | .fecha = $f' \
             version.json > version.json.tmp
          mv version.json.tmp version.json

          # Commit y push de vuelta a main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump version a $VERSION_NUEVA [skip ci]"
          git push

          # Exportar para los próximos steps
          echo "VERSION_NUEVA=$VERSION_NUEVA" >> $GITHUB_ENV

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
