name: Deploy con Auto-Versionado a GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  bump-and-deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Diagnóstico previo
        run: |
          echo "=== Archivos en la raíz ==="
          ls -la | head -20
          echo ""
          echo "=== ¿index.html existe? ==="
          test -f index.html && echo "SÍ existe" || echo "NO existe"
          echo ""
          echo "=== Tamaño ==="
          wc -c index.html || true
          echo ""
          echo "=== ¿Tiene <head>? ==="
          grep -c '<head' index.html || echo "0"
          echo ""
          echo "=== ¿Tiene <meta? (primeras 5) ==="
          grep -n '<meta' index.html | head -5 || echo "(sin coincidencias)"
          echo ""
          echo "=== ¿Tiene 'app-version'? ==="
          grep -n 'app-version' index.html | head -3 || echo "(sin coincidencias)"

      - name: Incrementar versión + sincronizar index.html
        run: |
          set -euo pipefail

          # 1) Validar version.json
          test -f version.json || { echo "::error::version.json no encontrado"; exit 1; }
          VERSION_ACTUAL=$(jq -er '.version' version.json)
          echo "Versión actual: $VERSION_ACTUAL"
          [[ "$VERSION_ACTUAL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version.json no tiene formato MAJOR.MINOR.PATCH: $VERSION_ACTUAL"
            exit 1
          }

          # 2) Incrementar patch
          IFS='.' read -ra PARTS <<< "$VERSION_ACTUAL"
          VERSION_NUEVA="${PARTS[0]}.${PARTS[1]}.$((PARTS[2] + 1))"
          echo "Nueva versión: $VERSION_NUEVA"
          FECHA=$(date -u +%Y-%m-%d)

          # 3) Actualizar version.json
          jq --arg v "$VERSION_NUEVA" --arg f "$FECHA" \
            '.version = $v | .fecha = $f' \
            version.json > version.json.tmp
          mv version.json.tmp version.json

          # 4) Sincronizar index.html (auto-healing: si falta el meta, lo inserta)
          VERSION_NUEVA="$VERSION_NUEVA" python3 << 'PYEOF'
          import os, re, sys

          version = os.environ['VERSION_NUEVA']

          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          # --- Intento 1: actualizar meta existente (name antes que content) ---
          new_content, count = re.subn(
              r'(<meta\s+name=["\']app-version["\']\s+content=["\'])[^"\']+(["\'])',
              rf'\g<1>{version}\g<2>', content)

          # --- Intento 2: actualizar meta existente (content antes que name) ---
          if count == 0:
              new_content, count = re.subn(
                  r'(<meta\s+content=["\'])[^"\']+(["\']\s+name=["\']app-version["\'])',
                  rf'\g<1>{version}\g<2>', content)

          # --- Intento 3: insertar meta nuevo justo después de <head> ---
          if count == 0:
              print("::warning::Meta app-version no encontrado. Insertando después de <head>...")
              new_content, count = re.subn(
                  r'(<head[^>]*>)',
                  rf'\1\n  <meta name="app-version" content="{version}">',
                  content, count=1)
              if count == 0:
                  print("::error::No se encontró <head> en index.html. Archivo corrupto o incompleto.")
                  print(f"::error::Primeras 500 chars: {content[:500]!r}")
                  sys.exit(1)
              print(f"OK: meta app-version INSERTADO después de <head> (versión {version})")
          else:
              print(f"OK: meta app-version ACTUALIZADO ({count} reemplazo/s) a {version}")

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(new_content)
          PYEOF

          # 5) Verificación final
          grep -q "content=\"${VERSION_NUEVA}\"" index.html || {
            echo "::error::Verificación post-sustitución falló: no se encontró la versión $VERSION_NUEVA en index.html"
            exit 1
          }
          echo "✅ index.html verificado y sincronizado a $VERSION_NUEVA"

          # 6) Commit de AMBOS archivos
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json index.html
          git commit -m "chore: bump version a $VERSION_NUEVA [skip ci]"
          git push

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
