<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📷📊 Cámara + Stock - Mejorar 2</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .header h1 { font-size: 20px; }
        .header .subtitle { font-size: 12px; opacity: 0.8; }
        .content { padding: 20px; }
        
        .info-box {
            background: #e8f5e9;
            border: 2px solid #2a9d4a;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .info-box h3 { color: #2a9d4a; margin-bottom: 8px; font-size: 14px; }
        .info-box p { font-size: 13px; color: #555; line-height: 1.6; }
        
        .btn-scan {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-scan:active { transform: scale(0.98); }
        
        .btn-add {
            background: #2a9d4a;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .stock-header h2 { font-size: 18px; color: #333; }
        
        .search-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .search-input:focus { outline: none; border-color: #667eea; }
        
        .product-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-info { flex: 1; }
        .product-name { font-weight: 600; font-size: 14px; color: #333; }
        .product-barcode { font-size: 11px; color: #888; font-family: monospace; margin-top: 2px; }
        .product-meta { font-size: 12px; color: #666; margin-top: 3px; }
        .product-stock-low { color: #d33; font-weight: 700; }
        .product-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: white;
            border: 1px solid #ddd;
            width: 36px; height: 36px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
        }
        .modal h3 { font-size: 18px; margin-bottom: 15px; color: #333; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; font-weight: 600; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cancel { flex: 1; padding: 12px; border-radius: 12px; background: #f0f0f5; border: none; font-weight: 600; cursor: pointer; }
        .btn-save { flex: 1; padding: 12px; border-radius: 12px; background: #2a9d4a; color: white; border: none; font-weight: 600; cursor: pointer; }
